<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" type="text/css" href="player.css">
    <title>Oriontunes - Player</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2323318809524914" crossorigin="anonymous"></script>

    <link rel="shortcut icon" href="orion-fav-modified.png" type="image/x-icon">
</head>

<body>

  <div class="main">
  	<p id="logo"><a href="index.html" class="nav__logo" style="text-decoration: none;font-size: 0.8rem;">
        <img src="orion-logo.png" alt="OrionTune Logo" width="80px" height="auto"><span class="tv" style="text-decoration: none; color: antiquewhite; font-size: 0.8rem;">Tune</span>
    </a></p>
    
        <!-- show_song_number -->
        <div class="show_song_no">
          <p id="present">1</p>
          <p>/</p>
          <p id="total">5</p>
        </div>


    <!--- left part --->
     <div class="left">

      <!--- song img --->
      <img id="track_image">
         <div class="volume">
            <p id="volume_show">90</p>
            <i class="fa fa-volume-up" aria-hidden="true" onclick="mute_sound()" id="volume_icon"></i>
            <input type="range" min="0" max="100" value="90" onchange="volume_change()" id="volume">  
         </div>
<style>
    /* Style the track */
#volume {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 10px;
    background: rgba(16, 16, 16, 0.899);
    border-radius: 5px;
    outline: none;
    cursor: pointer;
}

/* WebKit browsers */
#volume::-webkit-slider-runnable-track {
    width: 100%;
    height: 10px;
    background: rgba(16, 16, 16, 0.899);
    border-radius: 5px;
}

#volume::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    background: linear-gradient(45deg, #ff0785, #ff5200);
    border-radius: 50%;
    cursor: pointer;
    margin-top: -5px; /* Centers the thumb on the track */
}

/* Mozilla Firefox */
#volume::-moz-range-track {
    width: 100%;
    height: 10px;
    background: rgba(16, 16, 16, 0.899);
    border-radius: 5px;
}

#volume::-moz-range-thumb {
    width: 20px;
    height: 20px;
    background: linear-gradient(45deg, #ff0785, #ff5200);
    border-radius: 50%;
    cursor: pointer;
}

/* Microsoft Edge and IE */
#volume::-ms-track {
    width: 100%;
    height: 10px;
    background: rgba(16, 16, 16, 0.899);
    border-radius: 5px;
    border: none; /* Removes the default border in Edge */
}

#volume::-ms-thumb {
    width: 20px;
    height: 20px;
    background: linear-gradient(45deg, #ff0785, #ff5200);
    border-radius: 50%;
    cursor: pointer;
}

#volume::-ms-fill-lower {
    background: rgba(16, 16, 16, 0.899);
}

#volume::-ms-fill-upper {
    background: rgba(16, 16, 16, 0.899);
}
/* Style the track */
#duration_slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 10px;
    background: rgba(16, 16, 16, 0.899);
    border-radius: 5px;
    outline: none;
    cursor: pointer;
}

/* WebKit browsers */
#duration_slider::-webkit-slider-runnable-track {
    width: 100%;
    height: 10px;
    background: rgba(16, 16, 16, 0.899);
    border-radius: 5px;
}

#duration_slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    background: linear-gradient(45deg, #ff0785, #ff5200);
    border-radius: 50%;
    cursor: pointer;
    margin-top: -5px; /* Centers the thumb on the track */
}

/* Mozilla Firefox */
#duration_slider::-moz-range-track {
    width: 100%;
    height: 10px;
    background: rgba(16, 16, 16, 0.899);
    border-radius: 5px;
}

#duration_slider::-moz-range-thumb {
    width: 20px;
    height: 20px;
    background: linear-gradient(45deg, #ff0785, #ff5200);
    border-radius: 50%;
    cursor: pointer;
}

/* Microsoft Edge and IE */
#duration_slider::-ms-track {
    width: 100%;
    height: 10px;
    background: rgba(16, 16, 16, 0.899);
    border-radius: 5px;
    border: none; /* Removes the default border in Edge */
}

#duration_slider::-ms-thumb {
    width: 20px;
    height: 20px;
    background: linear-gradient(45deg, #ff0785, #ff5200);
    border-radius: 50%;
    cursor: pointer;
}

#duration_slider::-ms-fill-lower {
    background: rgba(16, 16, 16, 0.899);
}

#duration_slider::-ms-fill-upper {
    background: rgba(16, 16, 16, 0.899);
}

</style>
     </div>
 
     <!--- right part --->
  	 <div class="right">
       <!--- song title & artist name --->
       <div class="song_detail">
           <p id="title">title.mp3</p>
           <p id="artist">Artist name</p>
       </div>

      <!--- middle part --->
  	 	<div class="middle">
  	       <button onclick="previous_song()" id="pre"><i class="fa fa-step-backward" aria-hidden="true"></i></button>
      	   <button onclick="justplay()" id="play"><i class="fa fa-play" aria-hidden="true"></i></button>
  	       <button onclick="next_song()" id="next"><i class="fa fa-step-forward" aria-hidden="true"></i></button>
  	   </div>

       <!--- song duration part --->
        <div class="duration">
           <input type="range" min="0" max="100" value="0" id="duration_slider" onchange="change_duration()">
           <button id="auto" onclick="autoplay_switch()">Auto &nbsp;<i class="fa fa-circle-o-notch" aria-hidden="true"></i></button>
        </div>
           
  	</div>

   <div class="homeyall">
    <a href="index.html" class="gohome" style="text-decoration: none;">Home</a>
   </div>
  </div>

<script src="player.js"></script>

</body>
</html>
